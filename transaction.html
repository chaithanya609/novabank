<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBank ATM Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            overflow-x:hidden;
        }

        body::before{
            content:'';
            position:fixed;
            width:500px;
            height:500px;
            background:linear-gradient(45deg,#00c6ff,#0072ff);
            border-radius:50%;
            top:-150px;
            left:-150px;
            filter:blur(120px);
            z-index:-1;
        }

        body::after{
            content:'';
            position:fixed;
            width:450px;
            height:450px;
            background:linear-gradient(45deg,#7f00ff,#e100ff);
            border-radius:50%;
            bottom:-120px;
            right:-120px;
            filter:blur(120px);
            z-index:-1;
        }

        nav{
            width:100%;
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
        }

        .logo{
            font-size:32px;
            font-weight:bold;
        }

        .logo span{
            color:#00c6ff;
        }

        .logout-btn{
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:linear-gradient(45deg,#ff416c,#ff4b2b);
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        .welcome{
            padding:40px 8%;
        }

        .welcome h1{
            font-size:45px;
            margin-bottom:10px;
        }

        .welcome span{
            color:#00c6ff;
        }

        .user-box{
            margin-top:20px;
            background:rgba(255,255,255,0.08);
            padding:25px;
            border-radius:20px;
            line-height:2;
        }
         .dashboard{
            padding:20px 8%;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .card{
            background:rgba(255,255,255,0.08);
            border-radius:20px;
            padding:30px;
            backdrop-filter:blur(15px);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .card i{
            font-size:40px;
            color:#00c6ff;
            margin-bottom:20px;
        }

        .atm-section{
            padding:40px 8%;
        }

        .atm-box{
            background:rgba(255,255,255,0.08);
            padding:30px;
            border-radius:25px;
             }

        .atm-box h2{
            margin-bottom:25px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,0.1);
            color:white;
            outline:none;
            font-size:16px;
        }

        .input-box select option{
            color:black;
        }

        .action-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#00c6ff;
            color:white;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:40px;
            background:rgba(255,255,255,0.05);
            overflow:hidden;
            border-radius:20px;
        }

        th{
            background:#00c6ff;
            padding:16px;
        }

        td
        {
            padding:16px;
            text-align:center;
            border-bottom:1px solid rgba(255,255,255,0.1);
             }

    </style>
</head>
<body>

    <nav>

        <div class="logo">
            Nova<span>Bank</span>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </nav>

    <section class="welcome">

        <h1>
            Welcome <span id="username"></span>
        </h1>

        <div class="user-box">

            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Account Number:</strong> <span id="account"></span></p>
            <p><strong>Balance:</strong> ₹<span id="balance"></span></p>

        </div>

    </section>

    <section class="dashboard">
         <div class="card">
            <i class="fa-solid fa-wallet"></i>
            <h2>Current Balance</h2>
            <p>₹ <span id="balanceCard"></span></p>
        </div>

        <div class="card">
            <i class="fa-solid fa-building-columns"></i>
            <h2>Bank Type</h2>
            <p>Savings Account</p>
        </div>

        <div class="card">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>Security</h2>
            <p>Account Protected</p>
        </div>

    </section>

    <section class="atm-section">

        <div class="atm-box">

            <h2>ATM Simulation</h2>

            <form id="atmForm">

                <div class="input-box">

                    <select id="type" required>
                        <option value="">Select Operation</option>
                        <option value="Deposit">Deposit</option>
                        <option value="Withdraw">Withdraw</option>
                        <option value="Transfer">Transfer</option>
                    </select>

                </div>

                <div class="input-box">

                    <input type="number"
                           id="amount"
                           placeholder="Enter Amount"
                           required>

                </div>

                <div class="input-box">

                    <input type="text"
                           id="receiver"
                           placeholder="Receiver Account Number (Only for Transfer)">
                           </div>

                <button type="submit" class="action-btn">
                    Process Transaction
                </button>

            </form>

        </div>

        <table>

            <thead>
                 <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Receiver</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="transactionTable"></tbody>

        </table>

    </section>

<script>

    const user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        window.location.href = "login.html";
    }

    document.getElementById("username").innerText = user.username;
    document.getElementById("email").innerText = user.email;
    document.getElementById("account").innerText = user.accountNumber;

    async function loadUser(){

        const response = await fetch(`https://YOUR-RENDER-BACKEND.onrender.com/user/${user.accountNumber}`);

        const data = await response.json();
document.getElementById("balance").innerText = data.balance;
        document.getElementById("balanceCard").innerText = data.balance;

    }

    async function loadTransactions(){

        const response = await fetch(`https://YOUR-RENDER-BACKEND.onrender.com/transactions/${user.accountNumber}`);

        const data = await response.json();

        const table = document.getElementById("transactionTable");

        table.innerHTML = "";

        data.forEach(txn => {

            table.innerHTML += `

                <tr>
                    <td>${txn.date}</td>
                    <td>${txn.type}</td>
                    <td>₹${txn.amount}</td>
                    <td>${txn.receiver || '-'}</td>
                    <td>Success</td>
                </tr>

            `;

        });
document.getElementById("balance").innerText = data.balance;
        document.getElementById("balanceCard").innerText = data.balance;

    }

    async function loadTransactions(){

        const response = await fetch(`https://YOUR-RENDER-BACKEND.onrender.com/transactions/${user.accountNumber}`);

        const data = await response.json();

        const table = document.getElementById("transactionTable");

        table.innerHTML = "";

        data.forEach(txn => {

            table.innerHTML += `

                <tr>
                    <td>${txn.date}</td>
                    <td>${txn.type}</td>
                    <td>₹${txn.amount}</td>
                    <td>${txn.receiver || '-'}</td>
                    <td>Success</td>
                </tr>

            `;

        });
          }

    loadUser();
    loadTransactions();

    document.getElementById("atmForm").addEventListener("submit", async function(e){

        e.preventDefault();

        const transactionData = {

            accountNumber:user.accountNumber,
            type:document.getElementById("type").value,
            amount:document.getElementById("amount").value,
            receiver:document.getElementById("receiver").value

        };

        const response = await fetch("https://YOUR-RENDER-BACKEND.onrender.com/transaction", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(transactionData)

        });

        const result = await response.json();

        alert(result.message);

        loadUser();
        loadTransactions();

        document.getElementById("atmForm").reset();

    });

    function logout(){

        localStorage.clear();

        window.location.href = "login.html";

    }

</script>

</body>
</html>
